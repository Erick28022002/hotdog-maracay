<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>Cocina · Hot Dog Maracay</title>
  <style>
    :root {
      --accent:  #FAA83C;
      --urgent:  #E8272A;
      --blue:    #00A7D1;
      --green:   #4CAF50;
      --bg:      #0D0D0D;
      --surface: #161616;
      --card:    #1C1C1C;
      --border:  #2A2A2A;
      --text:    #F0F0F0;
      --muted:   #666;
      --font:    -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    }
    * { margin:0; padding:0; box-sizing:border-box }
    body { background:var(--bg); color:var(--text); font-family:var(--font); height:100vh; overflow:hidden }

    /* ── PIN ── */
    .screen { position:fixed; inset:0; background:var(--bg); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:999 }
    .screen.hidden { display:none }
    .scr-logo  { font-size:52px; margin-bottom:8px }
    .scr-brand { font-size:20px; font-weight:800; color:var(--accent); letter-spacing:.5px; margin-bottom:4px }
    .scr-sub   { font-size:12px; color:var(--muted); margin-bottom:36px; text-transform:uppercase; letter-spacing:1.5px }
    .pin-label { font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:1.5px; margin-bottom:14px }
    .pin-dots  { display:flex; gap:14px; margin-bottom:30px }
    .pin-dot   { width:14px; height:14px; border-radius:50%; border:2px solid var(--border); background:transparent; transition:all .2s }
    .pin-dot.on { background:var(--accent); border-color:var(--accent) }
    .pin-pad   { display:grid; grid-template-columns:repeat(3,72px); gap:10px }
    .pin-btn   { width:72px; height:72px; border-radius:50%; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:22px; font-weight:500; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .12s }
    .pin-btn:active { background:var(--accent); color:#000; transform:scale(.92) }
    .pin-btn.sp { font-size:15px; color:var(--muted) }
    .pin-err   { color:var(--urgent); font-size:12px; margin-top:16px; min-height:18px; text-align:center }

    /* ── SEDE ── */
    .sede-list { display:flex; flex-direction:column; gap:10px; width:100%; max-width:320px }
    .sede-btn  { padding:16px 20px; border-radius:10px; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:15px; font-weight:600; cursor:pointer; text-align:left; transition:all .15s; display:flex; align-items:center; justify-content:space-between }
    .sede-btn:hover  { border-color:var(--accent); background:#222 }
    .sede-btn:active { transform:scale(.97) }
    .logout-lnk { margin-top:22px; font-size:12px; color:var(--muted); cursor:pointer; text-decoration:underline }

    /* ── HEADER ── */
    .hdr { height:52px; background:var(--surface); border-bottom:1px solid var(--border); padding:0 22px; display:flex; align-items:center; justify-content:space-between; position:fixed; top:0; left:0; right:0; z-index:100 }
    .hdr-left  { display:flex; align-items:center; gap:14px }
    .hdr-brand { font-size:14px; font-weight:800; color:var(--accent); letter-spacing:.5px }
    .hdr-sede  { font-size:11px; color:var(--muted); padding:3px 10px; border:1px solid var(--border); border-radius:20px }
    .hdr-clock { font-size:22px; font-weight:300; letter-spacing:2px; font-variant-numeric:tabular-nums; color:var(--text) }
    .hdr-right { display:flex; align-items:center; gap:10px }
    .conn-pill { display:flex; align-items:center; gap:6px; padding:4px 12px; background:var(--card); border-radius:20px; font-size:11px; color:var(--muted) }
    .conn-dot  { width:7px; height:7px; border-radius:50%; background:var(--green); animation:blink 2s infinite }
    .conn-dot.off { background:var(--urgent); animation:blink .7s infinite }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }
    .hdr-btn { background:var(--card); border:1px solid var(--border); color:var(--muted); padding:5px 12px; border-radius:20px; font-size:12px; cursor:pointer; transition:all .2s }
    .hdr-btn:hover { border-color:var(--accent); color:var(--accent) }

    /* ── BARRA STATS ── */
    .stats-bar { height:40px; background:var(--surface); border-bottom:1px solid var(--border); padding:0 22px; display:flex; align-items:center; gap:28px; position:fixed; top:52px; left:0; right:0; z-index:99 }
    .stat-item { display:flex; align-items:center; gap:8px; font-size:12px; color:var(--muted) }
    .stat-num  { font-size:16px; font-weight:800; color:var(--text) }
    .stat-item.urg .stat-num { color:var(--urgent) }
    .hist-btn  { margin-left:auto; background:none; border:1px solid var(--border); color:var(--muted); padding:4px 14px; border-radius:20px; font-size:11px; cursor:pointer; transition:all .2s }
    .hist-btn:hover { border-color:var(--accent); color:var(--accent) }

    /* ── CARRIL ── */
    .lane { position:fixed; top:92px; left:0; right:0; bottom:0; display:flex; align-items:flex-start; gap:14px; padding:18px 22px; overflow-x:auto; overflow-y:hidden }
    .lane::-webkit-scrollbar { height:4px }
    .lane::-webkit-scrollbar-track { background:var(--bg) }
    .lane::-webkit-scrollbar-thumb { background:#333; border-radius:2px }
    .empty-lane { width:100%; display:flex; align-items:center; justify-content:center; color:var(--muted); font-size:13px }

    /* ── TICKET ── */
    .ticket {
      width:260px; min-width:260px;
      background:var(--card);
      border:1px solid var(--border);
      border-top:4px solid var(--accent);
      border-radius:10px;
      display:flex; flex-direction:column;
      flex-shrink:0;
      height:calc(100vh - 112px);
      overflow-y:auto;
      animation:cardIn .3s cubic-bezier(.175,.885,.32,1.275);
      transition:border-top-color .3s;
    }
    .ticket::-webkit-scrollbar { display:none }
    .ticket.urgent { border-top-color:var(--urgent) }
    @keyframes cardIn { from{opacity:0;transform:translateX(18px) scale(.96)} to{opacity:1;transform:translateX(0) scale(1)} }

    /* Secciones del ticket */
    .tk-div { border-bottom:1px solid var(--border) }

    .tk-hd { padding:14px 16px; display:flex; align-items:center; justify-content:space-between }
    .tk-num { font-size:16px; font-weight:800; color:var(--accent) }
    .tk-time { font-size:12px; color:var(--muted) }
    .tk-time.urgent { color:var(--urgent); font-weight:700 }

    .tk-meta { padding:8px 16px; display:flex; align-items:center; justify-content:space-between }
    .tk-type-badge { font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:1px; padding:3px 10px; border-radius:4px }
    .tk-type-badge.pickup   { background:rgba(250,168,60,.12); color:var(--accent) }
    .tk-type-badge.delivery { background:rgba(0,167,209,.12);  color:var(--blue) }
    .tk-src { font-size:11px; color:var(--muted) }

    .tk-cust { padding:12px 16px }
    .tk-cust-name  { font-size:15px; font-weight:700 }
    .tk-cust-phone { font-size:12px; color:var(--muted); margin-top:3px }

    .tk-items { padding:14px 16px; display:flex; flex-direction:column; gap:14px; flex:1 }
    .tk-item-row { display:flex; gap:10px; align-items:flex-start }
    .tk-qty  { background:var(--accent); color:#000; min-width:28px; height:28px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:800; flex-shrink:0 }
    .tk-name { font-size:15px; font-weight:600; line-height:1.3; padding-top:3px }
    .tk-mods { margin-left:38px; margin-top:5px; display:flex; flex-direction:column; gap:3px }
    .tk-mod  { font-size:12px; color:var(--muted) }
    .tk-mod.sin   { color:#FF7777 }
    .tk-mod.extra { color:#88CC88 }
    .tk-mod.salsa { color:#66BBDD }

    .tk-notes { padding:10px 16px; background:rgba(255,224,0,.05); display:flex; gap:8px }
    .tk-notes-txt { font-size:13px; color:#DDD080; line-height:1.6 }

    .tk-ft { padding:14px 16px; margin-top:auto }
    .tk-done-btn {
      width:100%; padding:13px;
      background:var(--accent); color:#000;
      border:none; border-radius:8px;
      font-size:14px; font-weight:800;
      cursor:pointer; letter-spacing:.5px;
      text-transform:uppercase; transition:all .15s
    }
    .tk-done-btn:hover  { opacity:.85 }
    .tk-done-btn:active { transform:scale(.96) }

    /* ── HISTORIAL ── */
    .hist-panel { position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:200; display:none; align-items:flex-end }
    .hist-panel.open { display:flex }
    .hist-inner { background:var(--surface); width:100%; max-height:55vh; border-top:1px solid var(--border); display:flex; flex-direction:column }
    .hist-head  { padding:14px 22px; border-bottom:1px solid var(--border); display:flex; align-items:center; justify-content:space-between }
    .hist-head h3 { font-size:14px; font-weight:700; color:var(--accent) }
    .hist-close { background:none; border:none; font-size:20px; cursor:pointer; color:var(--muted) }
    .hist-list  { overflow-y:auto; flex:1 }
    .hist-row   { padding:11px 22px; border-bottom:1px solid var(--border); display:flex; align-items:center; gap:14px; font-size:12px }
    .hist-row-num  { font-weight:800; color:var(--accent); min-width:44px }
    .hist-row-info { flex:1; color:var(--muted) }
    .hist-row-time { font-size:11px; color:var(--muted) }
    .hist-recover  { background:none; border:1px solid var(--border); color:var(--muted); padding:4px 12px; border-radius:20px; font-size:11px; cursor:pointer; transition:all .2s; white-space:nowrap }
    .hist-recover:hover { border-color:var(--accent); color:var(--accent) }
    .hist-empty { padding:48px; text-align:center; color:var(--muted); font-size:13px }

    /* ── TOAST ── */
    .toast { position:fixed; bottom:22px; left:50%; transform:translateX(-50%) translateY(14px); background:var(--accent); color:#000; padding:11px 22px; border-radius:10px; font-size:13px; font-weight:700; z-index:500; opacity:0; transition:all .28s; pointer-events:none; white-space:nowrap }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0) }
  </style>
</head>
<body>

<!-- PIN -->
<div id="pinScreen" class="screen">
  <div class="scr-logo">🌭</div>
  <div class="scr-brand">Hot Dog Maracay</div>
  <div class="scr-sub">Sistema de Cocina · KDS</div>
  <div class="pin-label">Código de acceso</div>
  <div class="pin-dots">
    <div class="pin-dot" id="d0"></div><div class="pin-dot" id="d1"></div>
    <div class="pin-dot" id="d2"></div><div class="pin-dot" id="d3"></div>
  </div>
  <div class="pin-pad">
    <button class="pin-btn" onclick="pk('1')">1</button>
    <button class="pin-btn" onclick="pk('2')">2</button>
    <button class="pin-btn" onclick="pk('3')">3</button>
    <button class="pin-btn" onclick="pk('4')">4</button>
    <button class="pin-btn" onclick="pk('5')">5</button>
    <button class="pin-btn" onclick="pk('6')">6</button>
    <button class="pin-btn" onclick="pk('7')">7</button>
    <button class="pin-btn" onclick="pk('8')">8</button>
    <button class="pin-btn" onclick="pk('9')">9</button>
    <button class="pin-btn sp" onclick="pk('c')">✕</button>
    <button class="pin-btn" onclick="pk('0')">0</button>
    <button class="pin-btn sp" onclick="pk('b')">⌫</button>
  </div>
  <div class="pin-err" id="pinErr"></div>
</div>

<!-- SEDE -->
<div id="sedeScreen" class="screen hidden">
  <div class="scr-logo">📍</div>
  <div class="scr-brand">Hot Dog Maracay</div>
  <div class="scr-sub" style="margin-bottom:28px">Selecciona tu sede</div>
  <div class="sede-list">
    <button class="sede-btn" onclick="selectSede('North Miami')">North Miami <span style="color:var(--muted)">›</span></button>
    <button class="sede-btn" onclick="selectSede('Doral')">Doral <span style="color:var(--muted)">›</span></button>
    <button class="sede-btn" onclick="selectSede('Downtown Miami')">Downtown Miami <span style="color:var(--muted)">›</span></button>
  </div>
  <span class="logout-lnk" onclick="logout()">← Cambiar PIN</span>
</div>

<!-- KDS -->
<div id="kds" style="display:none">

  <header class="hdr">
    <div class="hdr-left">
      <span class="hdr-brand">Hot Dog Maracay</span>
      <span class="hdr-sede" id="locLabel">—</span>
    </div>
    <div class="hdr-clock" id="clk">00:00:00</div>
    <div class="hdr-right">
      <button class="hdr-btn" id="sndBtn" onclick="toggleSound()">🔊</button>
      <button class="hdr-btn" onclick="changeSede()">📍 Sede</button>
      <div class="conn-pill">
        <div class="conn-dot" id="connDot"></div>
        <span id="connTxt">Conectando</span>
      </div>
    </div>
  </header>

  <div class="stats-bar">
    <div class="stat-item">
      <span class="stat-num" id="cntPending">0</span>
      <span>en cocina</span>
    </div>
    <div class="stat-item urg" id="urgWrap" style="display:none">
      <span class="stat-num" id="cntUrgent">0</span>
      <span>llevan +10 min</span>
    </div>
    <button class="hist-btn" onclick="openHist()">↑ Historial</button>
  </div>

  <div class="lane" id="lane">
    <div class="empty-lane" id="emptyLane">— Cocina lista · esperando pedidos —</div>
  </div>

</div>

<!-- HISTORIAL -->
<div class="hist-panel" id="histPanel" onclick="closeHistOutside(event)">
  <div class="hist-inner">
    <div class="hist-head">
      <h3>Pedidos completados</h3>
      <button class="hist-close" onclick="closeHist()">×</button>
    </div>
    <div class="hist-list" id="histList"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://ckzvjudhpbhzisrrhozk.supabase.co';
const SUPABASE_KEY = 'sb_publishable_5cEosCpGfTIM-culYQ1ofA_xggsaIBc';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const PIN     = '2802';
const AUTH_KEY = 'hdm_kds_v2';
const SEDE_KEY = 'hdm_kds_sede';

let orders    = [], history = [], knownIds = new Set();
let soundOn   = true, firstLoad = true, activeSede = null, toastTmr = null;
let realtimeCh = null;

/* ── BOOT ── */
(function boot() {
  const auth = sessionStorage.getItem(AUTH_KEY);
  const sede = sessionStorage.getItem(SEDE_KEY);
  if (auth === PIN && sede) { activeSede = sede; unlockKDS(); }
  else if (auth === PIN) {
    document.getElementById('pinScreen').classList.add('hidden');
    document.getElementById('sedeScreen').classList.remove('hidden');
  }
})();

/* ── PIN ── */
let pinEntry = '';
function pk(k) {
  const err = document.getElementById('pinErr');
  err.textContent = '';
  if (k==='c') pinEntry='';
  else if (k==='b') pinEntry=pinEntry.slice(0,-1);
  else if (pinEntry.length<4) pinEntry+=k;
  for(let i=0;i<4;i++) document.getElementById('d'+i).classList.toggle('on',i<pinEntry.length);
  if (pinEntry.length===4) {
    if (pinEntry===PIN) {
      sessionStorage.setItem(AUTH_KEY,PIN);
      document.getElementById('pinScreen').classList.add('hidden');
      document.getElementById('sedeScreen').classList.remove('hidden');
    } else {
      err.textContent='Código incorrecto';
      setTimeout(()=>{ pinEntry=''; for(let i=0;i<4;i++) document.getElementById('d'+i).classList.remove('on'); err.textContent=''; },900);
    }
  }
}
document.addEventListener('keydown',e=>{
  if(!document.getElementById('pinScreen').classList.contains('hidden')){
    if(e.key>='0'&&e.key<='9') pk(e.key);
    if(e.key==='Backspace') pk('b');
    if(e.key==='Escape') pk('c');
  }
});

/* ── SEDE ── */
function selectSede(nombre) {
  activeSede=nombre; sessionStorage.setItem(SEDE_KEY,nombre);
  document.getElementById('sedeScreen').classList.add('hidden');
  unlockKDS();
}
function changeSede() {
  sessionStorage.removeItem(SEDE_KEY); activeSede=null; orders=[]; knownIds.clear(); firstLoad=true;
  document.getElementById('kds').style.display='none';
  document.getElementById('sedeScreen').classList.remove('hidden');
}
function logout() {
  sessionStorage.clear(); pinEntry='';
  for(let i=0;i<4;i++) document.getElementById('d'+i).classList.remove('on');
  document.getElementById('sedeScreen').classList.add('hidden');
  document.getElementById('pinScreen').classList.remove('hidden');
}

/* ── KDS ── */
function unlockKDS() {
  document.getElementById('locLabel').textContent = '📍 ' + activeSede;
  document.title = 'Cocina · ' + activeSede;
  document.getElementById('kds').style.display = 'block';
  tick(); setInterval(tick, 1000);
  loadOrders();
  subscribeRealtime();
}

function tick() {
  document.getElementById('clk').textContent = new Date().toLocaleTimeString('es-VE',{hour12:false});
}

/* ── SONIDO ── */
function beep() {
  if(!soundOn) return;
  try {
    const ctx=new(window.AudioContext||window.webkitAudioContext)();
    [[880,0],[880,.18],[1100,.36]].forEach(([f,t])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.connect(g);g.connect(ctx.destination);
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(.25,ctx.currentTime+t);
      g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+t+.3);
      o.start(ctx.currentTime+t);o.stop(ctx.currentTime+t+.35);
    });
  } catch(e){}
}
function toggleSound() {
  soundOn=!soundOn;
  const b=document.getElementById('sndBtn');
  b.textContent=soundOn?'🔊':'🔇';
  b.style.opacity=soundOn?'1':'.5';
}

/* ── TOAST ── */
function toast(msg) {
  clearTimeout(toastTmr);
  const el=document.getElementById('toast');
  el.textContent=msg; el.classList.add('show');
  toastTmr=setTimeout(()=>el.classList.remove('show'),2800);
}

/* ── HELPERS ── */
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function minsAgo(ts){return Math.floor((Date.now()-new Date(ts))/60000);}
function timeAgo(ts){
  const s=Math.floor((Date.now()-new Date(ts))/1000);
  if(s<60) return s+'s'; if(s<3600) return Math.floor(s/60)+' min';
  return Math.floor(s/3600)+'h '+Math.floor((s%3600)/60)+'min';
}
function parseMods(details) {
  if(!details) return '';
  let html='';
  details.split('·').map(p=>p.trim()).filter(Boolean).forEach(part=>{
    if(/^Sin:/i.test(part)) part.replace(/^Sin:\s*/i,'').split(',').forEach(v=>{const t=v.trim();if(t)html+=`<div class="tk-mod sin">✕ ${esc(t)}</div>`;});
    else if(/^Extra:/i.test(part)) part.replace(/^Extra:\s*/i,'').split(',').forEach(v=>{const t=v.trim();if(t)html+=`<div class="tk-mod extra">+ ${esc(t)}</div>`;});
    else if(/^Salsas:/i.test(part)) part.replace(/^Salsas:\s*/i,'').split(',').forEach(v=>{const t=v.trim();if(t)html+=`<div class="tk-mod salsa">~ ${esc(t)}</div>`;});
    else if(part) html+=`<div class="tk-mod">· ${esc(part)}</div>`;
  });
  return html;
}

/* ── RENDER ── */
function render() {
  const lane  = document.getElementById('lane');
  const empty = document.getElementById('emptyLane');
  const vis   = orders.filter(o=>o.status!=='completed');
  vis.sort((a,b)=>new Date(a.created_at)-new Date(b.created_at));

  const pending = vis.length;
  const urgent  = vis.filter(o=>minsAgo(o.created_at)>=10).length;
  document.getElementById('cntPending').textContent = pending;
  document.getElementById('cntUrgent').textContent  = urgent;
  document.getElementById('urgWrap').style.display  = urgent>0?'flex':'none';
  document.title = pending>0?`(${pending}) Cocina · ${activeSede}`:`Cocina · ${activeSede}`;

  if(!pending){ lane.innerHTML=''; lane.appendChild(empty); empty.style.display='flex'; return; }
  empty.style.display='none';

  const existingIds = new Set([...lane.querySelectorAll('.ticket')].map(el=>el.dataset.id));
  const visIds      = new Set(vis.map(o=>o.id));
  lane.querySelectorAll('.ticket').forEach(el=>{ if(!visIds.has(el.dataset.id)) el.remove(); });

  vis.forEach(o=>{
    if(existingIds.has(o.id)){
      // Solo actualizar tiempo y urgencia
      const el=lane.querySelector(`[data-id="${o.id}"]`);
      if(!el) return;
      const mins=minsAgo(o.created_at);
      el.classList.toggle('urgent',mins>=10);
      const timeEl=el.querySelector('.tk-time');
      if(timeEl){timeEl.textContent='hace '+timeAgo(o.created_at);timeEl.classList.toggle('urgent',mins>=10);}
      return;
    }

    const cust  = { name: o.customer_name || 'Cliente', phone: o.customer_phone || '' };
    let items = o.items || [];
    if (typeof items === 'string') try { items = JSON.parse(items); } catch(e) { items = []; }

    const mins   = minsAgo(o.created_at);
    const pickup = o.order_type !== 'delivery';
    const src    = 'Web';
    const ordNum = '#' + String(o.id).slice(-4).toUpperCase();

    const itemsHtml = items.map(it=>`
      <div class="tk-item">
        <div class="tk-item-row">
          <div class="tk-qty">×${it.qty||it.quantity||1}</div>
          <div class="tk-name">${esc(it.name)}</div>
        </div>
        ${parseMods(it.details||it.note||'')?`<div class="tk-mods">${parseMods(it.details||it.note||'')}</div>`:''}
      </div>`).join('');

    const notes=o.notes||'';
    const el=document.createElement('div');
    el.className='ticket'+(mins>=10?' urgent':'');
    el.dataset.id=o.id;
    el.innerHTML=`
      <div class="tk-hd tk-div">
        <span class="tk-num">${ordNum}</span>
        <span class="tk-time${mins>=10?' urgent':''}">hace ${timeAgo(o.created_at)}</span>
      </div>
      <div class="tk-meta tk-div">
        <span class="tk-type-badge ${pickup?'pickup':'delivery'}">${pickup?'Pickup':'Delivery'}</span>
        <span class="tk-src">${src}</span>
      </div>
      <div class="tk-cust tk-div">
        <div class="tk-cust-name">${esc(cust.name||'Cliente')}</div>
        ${cust.phone?`<div class="tk-cust-phone">${esc(cust.phone)}</div>`:''}
      </div>
      <div class="tk-items tk-div">${itemsHtml}</div>
      ${notes?`<div class="tk-notes tk-div"><span class="tk-notes-txt">📋 ${esc(notes)}</span></div>`:''}
      <div class="tk-ft">
        <button class="tk-done-btn" onclick="completar('${esc(o.id)}')">✓ Preparado</button>
      </div>`;
    lane.appendChild(el);
  });
}

/* ── COMPLETAR ── */
async function completar(id) {
  const o = orders.find(x => x.id === id); if (!o) return;
  history.unshift({...o, completedAt: new Date().toISOString()});
  if (history.length > 30) history.pop();
  o.status = 'completed';
  const el = document.getElementById('lane').querySelector(`[data-id="${id}"]`);
  if (el) { el.style.opacity='0'; el.style.transform='scale(.94)'; el.style.transition='all .2s'; setTimeout(()=>el.remove(),200); }
  render(); toast('Pedido completado ✓');
  await db.from('web_orders').update({ status: 'completed' }).eq('id', id);
}

/* ── HISTORIAL ── */
function openHist() {
  const list=document.getElementById('histList');
  document.getElementById('histPanel').classList.add('open');
  if(!history.length){list.innerHTML='<div class="hist-empty">Sin pedidos completados en esta sesión</div>';return;}
  list.innerHTML=history.map((o,i)=>{
    let items=o.items||[];
    if(typeof items==='string') try{items=JSON.parse(items);}catch(e){items=[];}
    const resumen=items.map(it=>`×${it.qty||1} ${it.name}`).join(' · ');
    const ordNum=(o.orderNum||o.order_num)?'#'+String(o.orderNum||o.order_num).padStart(3,'0'):'#'+String(o.id).slice(-4).toUpperCase();
    const hora=new Date(o.completedAt).toLocaleTimeString('es-VE',{hour12:false,hour:'2-digit',minute:'2-digit'});
    return `<div class="hist-row">
      <span class="hist-row-num">${ordNum}</span>
      <span class="hist-row-info">${resumen}</span>
      <span class="hist-row-time">${hora}</span>
      <button class="hist-recover" onclick="recuperar(${i})">↩ Devolver</button>
    </div>`;
  }).join('');
}
function closeHist(){document.getElementById('histPanel').classList.remove('open');}
function closeHistOutside(e){if(e.target.id==='histPanel')closeHist();}
function recuperar(i) {
  const o=history[i]; if(!o) return;
  o.status='new'; orders=orders.filter(x=>x.id!==o.id); orders.push(o);
  history.splice(i,1); closeHist(); render(); toast('Pedido devuelto a cocina');
  db.from('web_orders').update({ status: 'new' }).eq('id', o.id);
}

/* ── CARGAR PEDIDOS DE HOY ── */
async function loadOrders() {
  setConn(false, 'Cargando...');
  const today = new Date(); today.setHours(0,0,0,0);
  const { data, error } = await db
    .from('web_orders')
    .select('*')
    .gte('created_at', today.toISOString())
    .neq('status', 'completed')
    .order('created_at', { ascending: true });

  if (error) { setConn(false, 'Error'); return; }
  orders = data || [];
  orders.forEach(o => knownIds.add(o.id));
  firstLoad = false;
  render();
}

/* ── REALTIME ── */
function subscribeRealtime() {
  if (realtimeCh) db.removeChannel(realtimeCh);
  realtimeCh = db.channel('kds-realtime')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'web_orders' }, payload => {
      const o = payload.new;
      if (knownIds.has(o.id)) return;
      knownIds.add(o.id);
      orders.push(o);
      render();
      beep();
      toast('🌭 Nuevo pedido — ' + (o.customer_name || ''));
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'web_orders' }, payload => {
      const updated = payload.new;
      const idx = orders.findIndex(o => o.id === updated.id);
      if (idx !== -1) { orders[idx] = { ...orders[idx], ...updated }; render(); }
    })
    .subscribe(status => {
      setConn(status === 'SUBSCRIBED', status === 'SUBSCRIBED' ? 'Conectado' : 'Conectando...');
    });
}

function setConn(ok, txt) {
  document.getElementById('connDot').classList.toggle('off', !ok);
  document.getElementById('connTxt').textContent = txt;
}
</script>
